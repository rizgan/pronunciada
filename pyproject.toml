[project]
name = "pronunciada"
version = "1.1.0"
description = "On-device pronunciation assessment in 10 languages: phoneme, word and sentence scores, tones and stress"
readme = "README.md"
requires-python = ">=3.10"
# Code: Apache-2.0. Bundled data: the it / pt / ru lexicons under pronunciada/data/lex are
# CC BY-SA (Wiktionary via WikiPron), and so are the it / pt / ru adapters trained towards them
# (pronunciada/data/adapters/{it,pt,ru}.npz); en is CMUdict (BSD-2-Clause), de / fr / es ipa-dict (MIT).
# The acoustic model is downloaded at first use (CC BY 4.0). Details: docs/LICENSING.md.
license = "Apache-2.0 AND CC-BY-SA-4.0 AND BSD-2-Clause AND MIT"
license-files = ["LICENSE", "NOTICE", "pronunciada/data/lex/LICENSE.txt"]
keywords = ["pronunciation", "pronunciation assessment", "speech", "language learning", "mispronunciation detection", "phone recognition", "onnx", "on-device"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Education",
]
# Runtime core: every language's acoustic scoring, English and the European front-ends.
# scipy is not imported anywhere under pronunciada/ (resampling: pronunciada/_resample.py, numpy only);
# the tests compare against it and bench/ uses it, so it sits in the dev and bench extras.
dependencies = ["numpy>=1.24", "onnxruntime>=1.16", "kaldi-native-fbank>=1.18", "soundfile>=0.12"]

[project.optional-dependencies]
# Text front-ends that need third-party packages (pinned versions: requirements/text-*.txt).
zh = ["pypinyin>=0.55", "jieba>=0.42", "opencc-python-reimplemented>=0.1.7"]
ja = ["pyopenjtalk-plus>=0.4.1"]
mcp = ["mcp>=2"]                        # MIT, optional: `pronunciada mcp` only
all = ["pronunciada[zh,ja,mcp]"]
dev = ["pytest", "scipy>=1.10"]
# Benchmarks and training only (bench/); never imported by pronunciada/ (see requirements-*.txt).
bench = ["pyarrow>=15", "fsspec>=2024.2", "aiohttp>=3.9", "requests>=2.31", "panphon>=0.20",
         "scikit-learn>=1.3", "pandas>=2", "huggingface_hub", "scipy>=1.10"]

[project.urls]
Homepage = "https://pronunciada.dev"
Repository = "https://github.com/moglearn/pronunciada"
Documentation = "https://github.com/moglearn/pronunciada#readme"
Scoreboard = "https://github.com/moglearn/pronunciada/blob/main/results/SCOREBOARD.md"
Issues = "https://github.com/moglearn/pronunciada/issues"

[project.scripts]
pronunciada = "pronunciada.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pronunciada*"]

[tool.setuptools.package-data]
pronunciada = ["data/**/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # tests of the benchmark helpers import bench/
